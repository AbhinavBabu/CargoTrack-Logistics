# SonarQube project configuration for CargoTrack
# This file is picked up automatically by the SonarQube scan action.

sonar.projectKey=cargotrack
sonar.projectName=CargoTrack Logistics Platform
sonar.projectVersion=1.0

# Source roots
sonar.sources=services,frontend/src
sonar.tests=services

# Exclusions — skip build artifacts, node_modules, migrations
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/prisma/migrations/**,\
  **/.next/**,\
  **/coverage/**

# Test file patterns
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx

# JavaScript/TypeScript analysis
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=services/core-service/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
