---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.aiService.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.aiService.serviceAccount.roleArn | quote }}
  labels:
    app: ai-service
    {{- include "cargotrack.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-service
    {{- include "cargotrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiService.replicas }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      serviceAccountName: {{ .Values.aiService.serviceAccount.name }}
      containers:
        - name: ai-service
          image: {{ .Values.image.registry }}/{{ .Values.aiService.image }}:{{ .Values.aiService.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aiService.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.aiService.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.aiService.port | quote }}
            - name: AWS_REGION
              value: {{ .Values.global.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.global.region | quote }}
            # AI mode: "true" = mock/rule-based, "false" = Bedrock Nova
            - name: MOCK_AGENT
              value: {{ .Values.aiService.env.MOCK_AGENT | quote }}
            - name: DB_HOST
              value: {{ .Values.aws.rdsEndpoint | quote }}
            - name: DB_NAME
              value: {{ .Values.aws.rdsDatabase | quote }}
            - name: DB_USER
              value: {{ .Values.aws.rdsUsername | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_SSL
              value: "true"
            - name: S3_BUCKET_NAME
              value: {{ .Values.aws.s3BucketName | quote }}
            - name: COMPLIANCE_QUEUE_URL
              value: {{ .Values.aws.complianceQueueUrl | quote }}
            - name: AUDIT_TABLE_NAME
              value: {{ .Values.aws.auditTableName | quote }}
            - name: DB_SECRET_ARN
              value: {{ .Values.aws.dbSecretArn | quote }}
          resources:
            {{- toYaml .Values.aiService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.aiService.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.aiService.port }}
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-service
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - name: http
      port: {{ .Values.aiService.port }}
      targetPort: {{ .Values.aiService.port }}
      protocol: TCP
