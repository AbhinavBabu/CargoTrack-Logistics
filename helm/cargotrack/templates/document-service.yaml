---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.documentService.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.documentService.serviceAccount.roleArn | quote }}
  labels:
    app: document-service
    {{- include "cargotrack.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: document-service
    {{- include "cargotrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.documentService.replicas }}
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      serviceAccountName: {{ .Values.documentService.serviceAccount.name }}
      containers:
        - name: document-service
          image: {{ .Values.image.registry }}/{{ .Values.documentService.image }}:{{ .Values.documentService.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.documentService.port }}
          envFrom:
            - configMapRef:
                name: cargotrack-aws-config
          env:
            - name: NODE_ENV
              value: {{ .Values.documentService.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.documentService.port | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargotrack-secrets
                  key: DATABASE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cargotrack-secrets
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.documentService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.documentService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.documentService.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: document-service
spec:
  type: ClusterIP
  selector:
    app: document-service
  ports:
    - name: http
      port: {{ .Values.documentService.port }}
      targetPort: {{ .Values.documentService.port }}
      protocol: TCP
