---
# Core Service ServiceAccount — annotated with IRSA role ARN for AWS API access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.coreService.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.coreService.serviceAccount.roleArn | quote }}
  labels:
    app: core-service
    {{- include "cargotrack.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: core-service
    {{- include "cargotrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coreService.replicas }}
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      serviceAccountName: {{ .Values.coreService.serviceAccount.name }}
      containers:
        - name: core-service
          image: {{ .Values.image.registry }}/{{ .Values.coreService.image }}:{{ .Values.coreService.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.coreService.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.coreService.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.coreService.port | quote }}
            - name: AWS_REGION
              value: {{ .Values.global.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.global.region | quote }}
            - name: DB_HOST
              value: {{ .Values.aws.rdsEndpoint | quote }}
            - name: DB_NAME
              value: {{ .Values.aws.rdsDatabase | quote }}
            - name: DB_USER
              value: {{ .Values.aws.rdsUsername | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_SSL
              value: "true"
            - name: S3_BUCKET_NAME
              value: {{ .Values.aws.s3BucketName | quote }}
            - name: EVENTBRIDGE_BUS_NAME
              value: {{ .Values.aws.eventBusName | quote }}
            - name: COMPLIANCE_QUEUE_URL
              value: {{ .Values.aws.complianceQueueUrl | quote }}
            - name: DB_SECRET_ARN
              value: {{ .Values.aws.dbSecretArn | quote }}
            - name: APP_SECRET_ARN
              value: {{ .Values.aws.appSecretArn | quote }}
          resources:
            {{- toYaml .Values.coreService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.coreService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.coreService.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: core-service
spec:
  type: ClusterIP
  selector:
    app: core-service
  ports:
    - name: http
      port: {{ .Values.coreService.port }}
      targetPort: {{ .Values.coreService.port }}
      protocol: TCP
