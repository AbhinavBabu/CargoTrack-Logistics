# CargoTrack — AWS Secrets ConfigMap
# Mounts Terraform-provisioned connection strings into pods.
# This ConfigMap holds NON-SENSITIVE config.
# Secrets (passwords, secret ARNs) are injected via IRSA + Secrets Manager at pod init.
# Generated by: terraform output → inject-values script → git push → ArgoCD sync
apiVersion: v1
kind: ConfigMap
metadata:
  name: cargotrack-aws-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cargotrack
data:
  AWS_DEFAULT_REGION: {{ .Values.aws.region | quote }}
  DATABASE_NAME: {{ .Values.aws.rdsDatabase | quote }}
  DATABASE_USER: {{ .Values.aws.rdsUsername | quote }}
  DATABASE_HOST: {{ .Values.aws.rdsEndpoint | quote }}
  DATABASE_PORT: "5432"
  S3_BUCKET: {{ .Values.aws.s3BucketName | quote }}
  EVENT_BUS_NAME: {{ .Values.aws.eventBusName | quote }}
  SQS_COMPLIANCE_QUEUE_URL: {{ .Values.aws.complianceQueueUrl | quote }}
  DYNAMO_AUDIT_TABLE: {{ .Values.aws.auditTableName | quote }}
  DB_SECRET_ARN: {{ .Values.aws.dbSecretArn | quote }}
  APP_SECRET_ARN: {{ .Values.aws.appSecretArn | quote }}
