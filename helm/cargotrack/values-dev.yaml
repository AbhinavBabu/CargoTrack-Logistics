# CargoTrack Dev Environment — Image + AWS resource overrides
# ─────────────────────────────────────────────────────────────────────────────
# ECR registry and image tags are set here permanently.
# The GitHub Actions workflow (build-push.yml) overwrites .image.registry and
# *.tag on every push — this file holds the last-known-good values for the
# manually-pushed v1 images.
# ─────────────────────────────────────────────────────────────────────────────

global:
  environment: dev
  region: us-east-1
  namespace: cargotrack

image:
  # ECR registry: <account_id>.dkr.ecr.<region>.amazonaws.com
  registry: "692828329130.dkr.ecr.us-east-1.amazonaws.com"
  pullPolicy: Always

# ── Image tags — all services use the v1 manually-pushed tag ─────────────────
# GitHub Actions overwrites these with the git SHA on every push.
coreService:
  tag: "v1"
  serviceAccount:
    roleArn: ""        # INJECT: terraform output irsa_core_service_role_arn

documentService:
  tag: "v1"
  serviceAccount:
    roleArn: ""        # INJECT: terraform output irsa_document_service_role_arn

aiService:
  tag: "v1"
  serviceAccount:
    roleArn: ""        # INJECT: terraform output irsa_ai_service_role_arn
  env:
    MOCK_AGENT: "true"          # Set to "false" when Bedrock access is confirmed
    TEXTRACT_ENABLED: "false"   # Set to "true" when Textract permissions verified

frontend:
  tag: "v1"

# ── HPA — dev: enabled with default CPU targets ───────────────────────────────
hpa:
  enabled: true

# ── AWS resource connections ───────────────────────────────────────────────────
# These are injected by the post-apply step or set manually after terraform apply.
# Run: terraform output -json | jq to retrieve each value.
aws:
  region: us-east-1
  rdsEndpoint: ""         # terraform output -raw rds_endpoint
  rdsDatabase: cargotrack
  rdsUsername: cargotrack
  s3BucketName: ""        # terraform output -raw s3_bucket_name
  eventBusName: ""        # terraform output -raw event_bus_name
  complianceQueueUrl: ""  # terraform output -raw compliance_queue_url
  auditTableName: ""      # terraform output -raw dynamodb_audit_table
  dbSecretArn: ""         # terraform output -raw db_secret_arn
  appSecretArn: ""        # terraform output -raw application_secret_arn
