name: Infra — Terraform Plan & Security Scan

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - cargotrack-terraform-v2
      - main
    paths:
      - 'cargotrack-infra/**'
      - '.github/workflows/infra.yml'   # re-run when this file itself changes
  pull_request:
    branches:
      - cargotrack-terraform-v2
      - main
    paths:
      - 'cargotrack-infra/**'
  # ── Manual trigger ────────────────────────────────────────────────────────────
  # Run from GitHub Actions tab → "Infra" → "Run workflow" button.
  # Use this after updating the workflow file to validate it with the new code.
  workflow_dispatch:

# ─── Permissions ───────────────────────────────────────────────────────────────
permissions:
  id-token: write        # OIDC → AWS (no long-lived keys)
  contents: read
  pull-requests: write   # Post plan output as PR comment
  security-events: write # Upload tfsec SARIF to GitHub Security tab

env:
  TF_WORKING_DIR: cargotrack-infra/environments/dev
  AWS_REGION: us-east-1

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: tfsec — Terraform security scan
  # Scans all .tf files for misconfigurations. No AWS credentials needed.
  # ════════════════════════════════════════════════════════════════════════════
  tfsec:
    name: tfsec Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install tfsec CLI directly so we control the exact output file path.
      # DO NOT use aquasecurity/tfsec-action@v1.0.0 — it pipes SARIF to stdout
      # (not to a file), causing "Path does not exist: results.sarif" on upload.
      - name: Install tfsec
        run: |
          curl -sL \
            https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec
          chmod +x /usr/local/bin/tfsec
          tfsec --version

      - name: Run tfsec and write SARIF to disk
        run: |
          tfsec cargotrack-infra \
            --format sarif \
            --soft-fail \
            --exclude-downloaded-modules \
            --minimum-severity MEDIUM \
            --out results.sarif || true
          # Verify file was written
          echo "--- tfsec SARIF output ---"
          ls -la results.sarif
          echo "tfsec scan complete"

      - name: Upload tfsec SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: tfsec

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Terraform Validate & Plan
  # ─────────────────────────────────────────────────────────────────────────
  # NOTE: This job uses -refresh=false and -lock=false because:
  #   - The Kubernetes/Helm providers need EKS cluster API access during refresh,
  #     which requires the GitHub Actions OIDC role to be in the cluster RBAC.
  #     Rather than grant that, we skip refresh and plan against Terraform state.
  #   - -lock=false avoids DynamoDB lock conflicts in parallel CI runs.
  #   This means the plan shows config changes, not live drift. That is fine for CI.
  # ════════════════════════════════════════════════════════════════════════════
  terraform-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: [tfsec]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      # The GitHub Actions OIDC role (cargotrack-github-actions-ecr-push) now has
      # AdministratorAccess (provisioned by modules/ecr/main.tf), so it can:
      #   - Read S3 state bucket
      #   - Run terraform plan against all AWS resource types
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true   # Formatting issues are warnings, not errors

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          # -refresh=false: skip live state refresh (avoids Kubernetes provider auth)
          # -lock=false:    skip DynamoDB lock (safe for read-only plan in CI)
          terraform plan \
            -input=false \
            -no-color \
            -refresh=false \
            -lock=false \
            2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Post the plan as a PR comment (pull requests only)
      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... [truncated — see Actions logs for full output]'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`cargotrack-infra/environments/dev\`\n\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Terraform Apply — DISABLED in CI
  # ─────────────────────────────────────────────────────────────────────────
  # Terraform apply is run LOCALLY from your dev machine:
  #   cd cargotrack-infra/environments/dev && terraform apply
  #
  # Reason: auto-apply from CI would mutate live infrastructure on every push.
  # If you want to enable it with a manual approval gate, set up a GitHub
  # Environment named "production" with required reviewers, then:
  #   1. Remove `if: false`
  #   2. Uncomment `environment: production`
  # ════════════════════════════════════════════════════════════════════════════
  terraform-apply:
    name: Terraform Apply (disabled)
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    if: false   # ← Remove this line to enable auto-apply
    # environment: production

    steps:
      - run: echo "Apply is disabled in CI. Run terraform apply locally."
