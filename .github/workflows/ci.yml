name: CI — Build, Scan & Push

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - cargotrack-terraform-v2
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'helm/**'
      - '.github/workflows/ci.yml'    # re-run when this file itself changes
  pull_request:
    branches:
      - cargotrack-terraform-v2
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
  # ── Manual trigger ────────────────────────────────────────────────────────────
  # Run from GitHub Actions tab → "CI" → "Run workflow" button.
  # Use this to build and push all Docker images without needing a dummy commit.
  workflow_dispatch:

# ─── Permissions ───────────────────────────────────────────────────────────────
permissions:
  id-token: write        # OIDC authentication to AWS (no long-lived keys)
  contents: write        # Push updated values-dev.yaml back to repo
  security-events: write # Upload Trivy SARIF to GitHub Security tab

# ─── Helper: is this a "real" run that should push to ECR? ────────────────────
# push events and manual workflow_dispatch both push images.
# pull_request events only build (validate Dockerfile), never push.

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: SonarQube SAST
  # Full-codebase static analysis. Runs once (not per-service).
  # Secrets are not available in fork PRs, so skip on pull_request events.
  # ════════════════════════════════════════════════════════════════════════════
  sonarqube:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full git history required for SonarQube blame/diff analysis

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Snyk SCA — dependency vulnerability scan
  # Checks package.json files for known CVEs. Non-blocking (continue-on-error).
  # ════════════════════════════════════════════════════════════════════════════
  snyk-sca:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Each service is scanned independently. continue-on-error means
      # vulnerabilities are reported but never block the pipeline.
      - name: Snyk scan — core-service
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=services/core-service/package.json --severity-threshold=high

      - name: Snyk scan — ai-service
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=services/ai-service/package.json --severity-threshold=high

      - name: Snyk scan — document-service
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=services/document-service/package.json --severity-threshold=high

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Build, Trivy image scan, and push to ECR
  # Runs all 4 services in parallel via matrix strategy.
  # On push/dispatch: builds and pushes to ECR.
  # On PR:           builds only (validates Dockerfile), no push.
  # ════════════════════════════════════════════════════════════════════════════
  build-scan-push:
    name: Build, Scan & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # Don't cancel siblings if one service fails
      matrix:
        include:
          - service: core-service
            context: ./services/core-service
            ecr_repo: cargotrack-core

          - service: ai-service
            context: ./services/ai-service
            ecr_repo: cargotrack-ai

          - service: document-service
            context: ./services/document-service
            ecr_repo: cargotrack-docs

          - service: frontend
            context: ./frontend
            ecr_repo: cargotrack-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS authentication via OIDC ───────────────────────────────────────────
      # The IAM role (cargotrack-github-actions-ecr-push) was created by Terraform.
      # It trusts this GitHub repository via OIDC — no long-lived AWS keys stored.
      # Skip on pull_request events (fork PRs can't access repo secrets).
      - name: Configure AWS credentials via OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Compute image tags ────────────────────────────────────────────────────
      # Push events & manual dispatch: use git SHA tag → deterministic + traceable
      # PR events:                     use pr-NNN tag, build locally only (no push)
      - name: Resolve image references
        id: img
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            SHA="${{ github.sha }}"
            echo "full_image=${REGISTRY}/${{ matrix.ecr_repo }}:${SHA}" >> $GITHUB_OUTPUT
            echo "latest_image=${REGISTRY}/${{ matrix.ecr_repo }}:latest"   >> $GITHUB_OUTPUT
            echo "should_push=true"  >> $GITHUB_OUTPUT
          else
            echo "full_image=${{ matrix.ecr_repo }}:pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "latest_image=${{ matrix.ecr_repo }}:latest-pr"                   >> $GITHUB_OUTPUT
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

      # ── Build Docker image ────────────────────────────────────────────────────
      # load=true: export to local Docker daemon so Trivy can scan it by name.
      # push=false: we push manually after Trivy scan (so broken images never land in ECR).
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.img.outputs.full_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ── Trivy image vulnerability scan ───────────────────────────────────────
      # Scans the locally-built image. CRITICAL/HIGH findings are reported but
      # never block the build (exit-code: '0'). Remove '0' to enforce blocking.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.full_image }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # ── Push to ECR ──────────────────────────────────────────────────────────
      # Runs only on push/dispatch events (not on PRs).
      # Pushes both :<sha> (permanent, traceable) and :latest (convenience).
      - name: Push image to ECR
        if: steps.img.outputs.should_push == 'true'
        run: |
          docker push "${{ steps.img.outputs.full_image }}"
          docker tag  "${{ steps.img.outputs.full_image }}" "${{ steps.img.outputs.latest_image }}"
          docker push "${{ steps.img.outputs.latest_image }}"
          echo "✅ Pushed ${{ matrix.service }} → ${{ steps.img.outputs.full_image }}"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: Update Helm values → trigger ArgoCD continuous delivery
  # Writes the new commit SHA into values-dev.yaml and pushes the commit.
  # ArgoCD polls Git every ~3 minutes, detects the tag change, and rolls out
  # new pods automatically — no manual sync needed.
  # ════════════════════════════════════════════════════════════════════════════
  update-helm-values:
    name: Update Helm Tags → ArgoCD deploys
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: github.event_name != 'pull_request' && success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Get ECR registry URL
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Write the new commit SHA and ECR registry into values-dev.yaml.
      # ArgoCD's auto-sync detects this git change and triggers a helm upgrade.
      - name: Update image tags in values-dev.yaml
        run: |
          SHA="${{ github.sha }}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"

          yq -i ".image.registry = \"${REGISTRY}\""   helm/cargotrack/values-dev.yaml
          yq -i ".coreService.tag = \"${SHA}\""        helm/cargotrack/values-dev.yaml
          yq -i ".documentService.tag = \"${SHA}\""    helm/cargotrack/values-dev.yaml
          yq -i ".aiService.tag = \"${SHA}\""          helm/cargotrack/values-dev.yaml
          yq -i ".frontend.tag = \"${SHA}\""           helm/cargotrack/values-dev.yaml

          echo "Updated values-dev.yaml with SHA=${SHA:0:8} and REGISTRY=${REGISTRY}"

      - name: Commit and push updated values
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/cargotrack/values-dev.yaml
          # Only commit if values actually changed (idempotent)
          git diff --staged --quiet || \
            git commit -m "ci: deploy images tagged ${GITHUB_SHA::8} to dev [skip ci]"
          git push
