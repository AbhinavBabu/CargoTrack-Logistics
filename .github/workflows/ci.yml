name: CI — Build, Scan & Push

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - cargotrack-terraform-v2
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'helm/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - cargotrack-terraform-v2
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
  workflow_dispatch:

# ─── Permissions ───────────────────────────────────────────────────────────────
permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: SonarQube SAST
  # FIX: sonar.organization is now derived dynamically from github.repository_owner
  # (lowercase), so no hardcoded org name is needed and no secret is required.
  # ════════════════════════════════════════════════════════════════════════════
  sonarqube:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derive the SonarCloud organization key from the GitHub repository owner.
      # SonarCloud org keys are always lowercase (e.g. AbhinavBabu → abhinavbabu).
      - name: Resolve SonarCloud organization key
        id: sonar
        run: |
          ORG=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "org=${ORG}" >> $GITHUB_OUTPUT
          echo "SonarCloud organization: ${ORG}"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ steps.sonar.outputs.org }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Snyk SCA — dependency vulnerability scan
  # FIX: npm ci is run for each service before Snyk scans.
  # Snyk requires node_modules to be present — it cannot scan package.json alone.
  # ════════════════════════════════════════════════════════════════════════════
  snyk-sca:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install dependencies for all services before scanning.
      # NOTE: npm ci requires package-lock.json. Since the repo does not commit
      # lock files, we use npm install (creates node_modules from package.json).
      - name: Install dependencies for all services
        run: |
          npm install --prefix services/core-service
          npm install --prefix services/ai-service
          npm install --prefix services/document-service

      - name: Snyk scan — core-service
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=services/core-service/package.json --severity-threshold=high

      - name: Snyk scan — ai-service
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=services/ai-service/package.json --severity-threshold=high

      - name: Snyk scan — document-service
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=services/document-service/package.json --severity-threshold=high

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Build, Trivy scan, push to ECR
  # FIX (OIDC): The IAM role trust policy has been corrected to use the exact
  #             case-sensitive repo name (CargoTrack-Logistics, not Cargotrack-Logistics).
  #             This was the root cause of all OIDC authentication failures.
  # FIX (Trivy): SARIF upload now uses continue-on-error so it never fails
  #              the job when the file doesn't exist (e.g. if build was skipped).
  # ════════════════════════════════════════════════════════════════════════════
  build-scan-push:
    name: Build, Scan & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-service
            context: ./services/core-service
            ecr_repo: cargotrack-core

          - service: ai-service
            context: ./services/ai-service
            ecr_repo: cargotrack-ai

          - service: document-service
            context: ./services/document-service
            ecr_repo: cargotrack-docs

          - service: frontend
            context: ./frontend
            ecr_repo: cargotrack-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image references
        id: img
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            SHA="${{ github.sha }}"
            echo "full_image=${REGISTRY}/${{ matrix.ecr_repo }}:${SHA}" >> $GITHUB_OUTPUT
            echo "latest_image=${REGISTRY}/${{ matrix.ecr_repo }}:latest"   >> $GITHUB_OUTPUT
            echo "should_push=true"  >> $GITHUB_OUTPUT
          else
            echo "full_image=${{ matrix.ecr_repo }}:pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "latest_image=${{ matrix.ecr_repo }}:latest-pr"                   >> $GITHUB_OUTPUT
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.img.outputs.full_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.full_image }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      # FIX: continue-on-error=true so if a prior step was skipped (e.g. OIDC
      # failure meant Docker build was skipped), a missing SARIF file never
      # causes the entire job to fail. Upload is still attempted when possible.
      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Push image to ECR
        if: steps.img.outputs.should_push == 'true'
        run: |
          docker push "${{ steps.img.outputs.full_image }}"
          docker tag  "${{ steps.img.outputs.full_image }}" "${{ steps.img.outputs.latest_image }}"
          docker push "${{ steps.img.outputs.latest_image }}"
          echo "✅ Pushed ${{ matrix.service }} → ${{ steps.img.outputs.full_image }}"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: Update Helm values → trigger ArgoCD
  # ════════════════════════════════════════════════════════════════════════════
  update-helm-values:
    name: Update Helm Tags → ArgoCD deploys
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: github.event_name != 'pull_request' && success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Get ECR registry URL
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags in values-dev.yaml
        run: |
          SHA="${{ github.sha }}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          yq -i ".image.registry = \"${REGISTRY}\""   helm/cargotrack/values-dev.yaml
          yq -i ".coreService.tag = \"${SHA}\""        helm/cargotrack/values-dev.yaml
          yq -i ".documentService.tag = \"${SHA}\""    helm/cargotrack/values-dev.yaml
          yq -i ".aiService.tag = \"${SHA}\""          helm/cargotrack/values-dev.yaml
          yq -i ".frontend.tag = \"${SHA}\""           helm/cargotrack/values-dev.yaml
          echo "Updated values-dev.yaml with SHA=${SHA:0:8}"

      - name: Commit and push updated values
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/cargotrack/values-dev.yaml
          git diff --staged --quiet || \
            git commit -m "ci: deploy images tagged ${GITHUB_SHA::8} to dev [skip ci]"
          git push
