name: Build and Deploy

on:
  push:
    branches:
      - cargotrack-v3-microservices
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'helm/**'

# ── Required GitHub Actions permissions for OIDC → AWS ───────────────────────
permissions:
  id-token: write     # OIDC token for AWS STS AssumeRoleWithWebIdentity
  contents: write     # push updated values-dev.yaml back to repo

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: core-service
            context: ./services/core-service
            ecr_repo: cargotrack-core
            valueKey: coreService.tag
          - service: document-service
            context: ./services/document-service
            ecr_repo: cargotrack-docs
            valueKey: documentService.tag
          - service: ai-service
            context: ./services/ai-service
            ecr_repo: cargotrack-ai
            valueKey: aiService.tag
          - service: frontend
            context: ./frontend
            ecr_repo: cargotrack-frontend
            valueKey: frontend.tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Authenticate to AWS via OIDC (no long-lived keys) ─────────────────
      # Prerequisites (one-time setup):
      #   1. Create an OIDC provider in IAM for token.actions.githubusercontent.com
      #   2. Create an IAM role with trust policy for this repo and ECR push permissions
      #   3. Add secret AWS_ECR_PUSH_ROLE_ARN to GitHub repo secrets
      #   4. Add secret AWS_ACCOUNT_ID to GitHub repo secrets
      #   5. Add secret AWS_REGION to GitHub repo secrets (default: us-east-1)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # ── Login to ECR ───────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build and push to ECR ──────────────────────────────────────────────
      # Image URI: <account>.dkr.ecr.<region>.amazonaws.com/<repo>:<tag>
      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Update Helm values with new image tag and ECR registry ─────────────────
  update-helm-values:
    name: Update Helm Image Tags
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # ── Re-auth to get ECR registry URL for values injection ──────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Get ECR registry URL
        id: ecr
        run: |
          REGISTRY=$(aws ecr describe-registry --query 'registryId' --output text)
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          echo "registry=${REGISTRY}.dkr.ecr.${REGION}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # ── Inject new commit SHA and ECR registry into values-dev.yaml ───────
      # ArgoCD detects this commit and triggers a rolling deploy automatically.
      - name: Update image tags and registry in values-dev.yaml
        run: |
          yq -i '.image.registry = "${{ steps.ecr.outputs.registry }}"' \
            helm/cargotrack/values-dev.yaml
          yq -i '.coreService.tag = "${{ github.sha }}"' \
            helm/cargotrack/values-dev.yaml
          yq -i '.documentService.tag = "${{ github.sha }}"' \
            helm/cargotrack/values-dev.yaml
          yq -i '.aiService.tag = "${{ github.sha }}"' \
            helm/cargotrack/values-dev.yaml
          yq -i '.frontend.tag = "${{ github.sha }}"' \
            helm/cargotrack/values-dev.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/cargotrack/values-dev.yaml
          git diff --staged --quiet || \
            git commit -m "ci: update ECR image tags to ${{ github.sha }}"
          git push

# ArgoCD (gitops/apps/cargotrack-dev.yaml) automatically detects the
# values-dev.yaml change and triggers a helm upgrade — no manual sync needed.
