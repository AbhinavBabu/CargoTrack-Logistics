name: Build and Deploy

on:
  push:
    branches:
      - cargotrack-v3-microservices
      - main
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'helm/**'

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: core-service
            context: ./services/core-service
            image: cargotrack-core
            valueKey: coreService.tag
          - service: document-service
            context: ./services/document-service
            image: cargotrack-docs
            valueKey: documentService.tag
          - service: ai-service
            context: ./services/ai-service
            image: cargotrack-ai
            valueKey: aiService.tag
          - service: frontend
            context: ./frontend
            image: cargotrack-frontend
            valueKey: frontend.tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-values:
    name: Update Helm Image Tags
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags in values-dev.yaml
        run: |
          # Update each service image tag to the new commit SHA
          yq -i '.coreService.tag = "${{ github.sha }}"' helm/cargotrack/values-dev.yaml
          yq -i '.documentService.tag = "${{ github.sha }}"' helm/cargotrack/values-dev.yaml
          yq -i '.aiService.tag = "${{ github.sha }}"' helm/cargotrack/values-dev.yaml
          yq -i '.frontend.tag = "${{ github.sha }}"' helm/cargotrack/values-dev.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/cargotrack/values-dev.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push

  # ArgoCD automatically detects the values-dev.yaml change and deploys
  # No explicit ArgoCD sync step needed — automated sync handles it
